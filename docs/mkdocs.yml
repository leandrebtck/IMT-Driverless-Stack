docs_dir: .
site_dir: site

site_name: IMT Driverless Stack
site_description: Stack de perception et SLAM temps réel pour Formula Student Driverless — IMT
site_author: IMT Driverless Team
repo_url: https://github.com/leandrebtck/IMT-Driverless-Stack
repo_name: IMT-Driverless-Stack
copyright: "IMT Driverless Team"

theme:
  name: material
  language: fr
  logo: assets/logo_imtensity_nobg.png
  favicon: assets/logo_imtensity_nobg.png
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Mode clair
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Mode sombre
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - toc.follow

nav:
  - Accueil: index.md
  - Fonctionnalités: features.md
  - Architecture:
    - Vue d'ensemble: architecture/overview.md
    - Topics ROS2: architecture/topics.md
    - Repères TF: architecture/tf_frames.md
    - Pipelines détaillés: architecture/pipelines.md
    - Déploiement réel: architecture/deployment.md
  - Matériel réel: hardware.md
  - Installation: installation.md
  - Lancement: lancement.md
  - Paramètres: parameters.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: Sur cette page
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search:
      lang: fr

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
